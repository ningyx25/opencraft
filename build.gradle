plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	// Shadow：把 openai-java 及全部传递依赖 flat 进 mod jar
	// com.gradleup.shadow 是 johnrengelman/shadow 的社区维护分支，支持 Gradle 9.x
	id 'com.gradleup.shadow' version '8.3.8'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	// openai-java（OpenAI 兼容 Chat Completions 客户端）来自 Maven Central
	// 国内加速：阿里云 central 镜像（完整镜像 Maven Central）。跨境直连 repo.maven.apache.org
	// 连接建立瞬间短暂爆发后持续限速到 ~10KB/s，换国内镜像后稳定在多 MB/s，其他环境照常可用。
	maven { url = 'https://maven.aliyun.com/repository/central' }
	mavenCentral()
	// ReplayMod（仅开发期：无头回放渲染 .mcpr -> mp4，不打包进生产 jar）
	maven { url = 'https://api.modrinth.com/maven' }
}

// shade 配置：声明在这里的库会被 shadowJar flat 进 mod jar，不走 JiJ
configurations {
	shade
	implementation.extendsFrom shade
}

// 回放渲染器小 mod 的源集（dev-only，见 loom.mods 与 afterEvaluate 接线）
sourceSets {
	renderer {
		runtimeClasspath += output + compileClasspath
	}
}

loom {
	accessWidenerPath = file("src/main/resources/opencraft.accesswidener")

	splitEnvironmentSourceSets()

	runs {
		// 运行 Fabric Gametest（无头测试服务器，跑完自动退出）：
		//   ./gradlew runGametestServer
		gametestServer {
			server()
			vmArg '-Dfabric-api.gametest=true'
			vmArg "-Dfabric-api.gametest.filter=${project.findProperty('gametestFilter') ?: 'opencraft:*'}"
			vmArg '-Dfabric-api.gametest.report-file=build/gametest-results.xml'
		}
		// 运行端到端测试（自然世界出生点 + 真实 LLM + general_agent）：
		//   ./gradlew runE2E -Pe2eTask=chop_tree
		// 每个任务都必须使用独立新生成世界；全量入口见 bin/run_e2e_all.sh。
		e2eServer {
			server()
			vmArg "-Dopencraft.e2e.autorun=${project.findProperty('e2eTask') ?: ''}"
			// 可选：-Pe2eProbe=true 只做出生点自然地形勘察，不召唤助手/不调用 LLM
			vmArg "-Dopencraft.e2e.probe=${project.findProperty('e2eProbe') ?: 'false'}"
			// 可选：-Pe2eHoldMs=<毫秒> 任务跑完后服务器保持运行（真客户端启动慢，
			// 需要这段时间连上、被粘到助手眼睛、截图）；默认 0 = 立即退出
			vmArg "-Dopencraft.e2e.holdMs=${project.findProperty('e2eHoldMs') ?: '0'}"
			// 可选：-Pe2eBaseUrl=http://127.0.0.1:18923/v1 把 e2e 方块 LLM 指向 mock 服务器
			// （AiBlockConfig.defaultBaseUrl 优先读 -Dopencraft.baseUrl；空值回退正常配置）
			vmArg "-Dopencraft.baseUrl=${project.findProperty('e2eBaseUrl') ?: ''}"
			// e2e 默认开启 OpenCraft 业务调试日志（LLM 逐轮请求/回复/重试/失败写
			// logs/opencraft-debug.log，任务结束另存 e2e-debug-<task>.log）——
			// 否则"助手什么都没做就结束"这类失败没有 LLM 层证据可查。
			vmArg '-Dopencraft.debug=true'
		}
	}

	mods {
		"opencraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		// 回放渲染器小 mod（src/renderer，独立 fabric.mod.json），dev 运行时随 mods 容器自动加入
		"opencraft-replay-renderer" {
			sourceSet sourceSets.renderer
		}
	}

}

// ------------------------------------------------------------------
// 回放自动渲染器（dev-only 小 mod）：源码 src/renderer，自己的 fabric.mod.json
// （mod id opencraft-replay-renderer，纯 client）。只挂到 runClient 运行时
// classpath（runs.client.source）；shadowJar 只 from main+client，生产 jar 不含它。
// ReplayMod 仅 modCompileOnly/modRuntimeOnly，不打包。
// ------------------------------------------------------------------
loom {
	runs {
		client {
			vmArg "-Dopencraft.render.replay=${project.findProperty('renderReplay') ?: ''}"
			vmArg "-Dopencraft.render.out=${project.findProperty('renderOut') ?: ''}"
			vmArg "-Dopencraft.render.follow=${project.findProperty('renderFollow') ?: ''}"
			vmArg "-Dopencraft.render.width=${project.findProperty('renderWidth') ?: '1280'}"
			vmArg "-Dopencraft.render.height=${project.findProperty('renderHeight') ?: '720'}"
			vmArg "-Dopencraft.render.fps=${project.findProperty('renderFps') ?: '20'}"
			vmArg "-Dopencraft.render.from=${project.findProperty('renderFrom') ?: '0'}"
			vmArg "-Dopencraft.render.to=${project.findProperty('renderTo') ?: '0'}"
		}
	}
}

// renderer 源集需要 client 源集（splitEnvironmentSourceSets 在 loom 内创建），
// 类路径接线延迟到评估完成；ReplayMod 经 modClientCompileOnly（loom remap）随之可见。
afterEvaluate {
	sourceSets.renderer.compileClasspath += sourceSets.main.compileClasspath + sourceSets.client.compileClasspath
	tasks.named('compileRendererJava') { dependsOn 'compileClientJava' }
	// 把渲染器小 mod 的类与资源（fabric.mod.json）追加到 runClient 类路径。
	// 注意：不用 loom runs 的 source()——它会整体重写 run classpath 导致 dev-launch-injector 丢失；
	// 外部依赖（ReplayMod 等）已在类路径上，这里只需 renderer 自己的输出目录。
	tasks.named('runClient') {
		classpath += files(sourceSets.renderer.java.classesDirectory, sourceSets.renderer.output.resourcesDir)
		dependsOn tasks.named('compileRendererJava'), tasks.named('processRendererResources')
	}
}

// ------------------------------------------------------------------
// 项目级环境变量：读取项目根目录的 .env，注入到本项目的所有 run 任务
// （runClient / runServer / runGametestServer）的 JavaExec 进程环境变量，
// 仅在本项目生效。代码里的 OPEN_CRAFT_* 默认值会优先读这些环境变量。
// ------------------------------------------------------------------
def loadLocalEnv() {
	File envFile = file('.env')
	if (!envFile.exists()) {
		return [:]
	}
	def envMap = [:]
	envFile.readLines().each { line ->
		def trimmed = line.trim()
		if (trimmed.isEmpty() || trimmed.startsWith('#') || !trimmed.contains('=')) {
			return
		}
		def eq = trimmed.indexOf('=')
		def key = trimmed.substring(0, eq).trim()
		def value = trimmed.substring(eq + 1).trim()
		// 去掉成对引号（支持 key="value with spaces"）
		if (value.length() >= 2 && value.startsWith('"') && value.endsWith('"')) {
			value = value.substring(1, value.length() - 1)
		}
		if (!key.isEmpty()) {
			envMap[key] = value
		}
	}
	return envMap
}
def localEnv = loadLocalEnv()

// 把 .env 变量注入到所有 JavaExec 派生的 run 任务（runClient/runServer/runGametestServer）
tasks.withType(JavaExec).configureEach {
	it.environment(localEnv)
}

// ------------------------------------------------------------------
// 编译期烘焙默认值：把 .env 的值以 XOR 混淆字节（key "opencraft"）写入
// build/generated/resources/opencraft/defaults.dat，随 jar 发布。
// 这样 jar 放进游戏后无需任何环境变量也能用上 .env 的默认配置，
// 且 jar 内不出现明文（与 AiBlockConfig.decodeXor 对应）。
// ------------------------------------------------------------------
def xorEncode(String plain, String key) {
	byte[] plainBytes = plain.getBytes("UTF-8")
	byte[] keyBytes = key.getBytes("UTF-8")
	StringBuilder sb = new StringBuilder()
	for (int i = 0; i < plainBytes.length; i++) {
		sb.append(String.format("%02x", plainBytes[i] ^ keyBytes[i % keyBytes.length]))
	}
	return sb.toString()
}

tasks.register('generateDefaultsResource') {
	def outputDir = layout.buildDirectory.dir('generated/resources/opencraft')
	def env = loadLocalEnv()
	inputs.property('env', env.toString())
	outputs.dir(outputDir)
	doLast {
		def dir = outputDir.get().asFile
		dir.mkdirs()
		def key = 'opencraft'
		def content = new StringBuilder()
		// .env 缺失某个值时回退到代码内置默认（与 AiBlockConfig 的回退一致）
		content.append('baseUrl=').append(xorEncode(env.OPEN_CRAFT_BASE_URL ?: 'https://api.openai.com/v1', key)).append('\n')
		content.append('model=').append(xorEncode(env.OPEN_CRAFT_MODEL ?: 'gpt-4o', key)).append('\n')
		content.append('apiKey=').append(xorEncode(env.OPEN_CRAFT_API_KEY ?: '', key)).append('\n')
		new File(dir, 'defaults.dat').text = content.toString()
	}
}
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/resources'))
tasks.named('processResources') { dependsOn(tasks.named('generateDefaultsResource')) }
// 生成物不算源码：sourcesJar 不打包 defaults.dat，但要声明依赖避免 Gradle 校验报错
tasks.configureEach { task ->
	if (task.name == 'sourcesJar') {
		task.dependsOn(tasks.named('generateDefaultsResource'))
		task.exclude('opencraft/defaults.dat')
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// ReplayMod：仅开发期无头回放渲染用（modClientCompileOnly 不打包；modRuntimeOnly 进 runClient）
	modClientCompileOnly "maven.modrinth:replaymod:1.21.11-2.6.27"
	modClientRuntimeOnly "maven.modrinth:replaymod:1.21.11-2.6.27"

	// OpenAI 兼容 Chat Completions 客户端（openai-java，纯库非 mod）：
	// shade 配置：Shadow 插件会把该库及全部传递依赖（openai-java-core、OkHttp、Jackson、
	// Kotlin stdlib 等）flat 进 mod jar，游戏启动器无需提前把这些库放到 classpath。
	// 同时 relocate 到 com.swaydy.opencraft.shadow.* 避免与其他 mod 冲突。
	shade("com.openai:openai-java:4.52.0")

	// 纯 Java 单测（LlmClient SSE 工具调用分片合并、AgentRegistry 等，无 Minecraft 运行时依赖）
	testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.2"
	testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}

test {
	useJUnitPlatform()
}

// 构建时顺带编译回放渲染器（防止 tools 代码腐烂；它不参与 jar 打包）
tasks.named('build') {
	dependsOn tasks.named('compileRendererJava')
}

// ------------------------------------------------------------------
// Shadow：把 shade 配置的依赖 flat 进 jar。
//
// 1) 排除 openai-java SDK 中 mod 不用的子包（mod 只用 models.chat.completions.* +
//    core/errors/client/services.blocking.chat）。openai-java-core-4.52.0.jar 解压
//    后 ~140 MB / 26k+ 文件；排除后 SDK 在 jar 里的占用从 ~46 MB 降到 ~2.5 MB。
//    实测整 jar 从 60 MB 降到 ~16 MB。
// 2) relocate()：把 org.slf4j / kotlin / okhttp3 / okio / jackson / openai 全部
//    重命名到 com.swaydy.opencraft.shadow.* 下，避免与 Mojang 自带 slf4j、
//    fabric-language-kotlin、其它 mod 共用 FQN 时类路径冲突。
//    历史曾担心 Shadow 8.x Remapper 对 Java 21 record 的 invokedynamic +
//    ConstantDynamic 字节码处理不稳；实测 Shadow 8.3.6 在此 codebase 下没问题。
//    若以后升级 Shadow 出现 ASM pass 异常，可临时回退到「只排除不 relocate」，
//    大小瘦身仍然成立。
// 3) archiveClassifier = 'dev-shadow'：未 remap 的胖 jar，交给 Loom remapJar 处理。
// ------------------------------------------------------------------
shadowJar {
	// Loom splitEnvironmentSourceSets() 把 client 代码拆到独立 source set，
	// shadowJar 默认只含 sourceSets.main.output，必须手动补上 client。
	from sourceSets.client.output
	configurations = [project.configurations.shade]
	archiveClassifier = 'dev-shadow'

	// 合并 META-INF/services（OkHttp 等 SPI 服务发现需要）
	mergeServiceFiles()

	// 排除签名文件和重复协议文本，避免 jar 校验失败
	exclude 'META-INF/LICENSE*'
	exclude 'META-INF/NOTICE*'
	exclude 'META-INF/DEPENDENCIES'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'

	// ---- openai-java 子包瘦身（mod 只用 chat.completions + core/errors/client）----
	// mod 实际只引用 com.openai.models.chat.completions.* + 7 个根 models.* 类
	// + core / errors / client / services.blocking.chat 子树；其余 ~140 MB
	// 是 SDK 全量 OpenAPI 生成的死包。具体依赖图见
	// /home/swaydy/.claude/plans/bubbly-tickling-fern.md。
	exclude 'com/openai/models/beta/**'
	exclude 'com/openai/models/admin/**'
	exclude 'com/openai/models/responses/**'
	exclude 'com/openai/models/realtime/**'
	exclude 'com/openai/models/evals/**'
	exclude 'com/openai/models/finetuning/**'
	exclude 'com/openai/models/vectorstores/**'
	exclude 'com/openai/models/conversations/**'
	exclude 'com/openai/models/audio/**'
	exclude 'com/openai/models/webhooks/**'
	exclude 'com/openai/models/images/**'
	exclude 'com/openai/models/containers/**'
	exclude 'com/openai/models/videos/**'
	exclude 'com/openai/models/graders/**'
	exclude 'com/openai/models/moderations/**'
	exclude 'com/openai/models/skills/**'
	exclude 'com/openai/models/batches/**'
	exclude 'com/openai/models/files/**'
	exclude 'com/openai/models/uploads/**'
	exclude 'com/openai/models/embeddings/**'
	exclude 'com/openai/models/contentprovenancechecks/**'
	// "com.openai.models.models"（列出可用模型的元 API）也未使用；chat 子树在
	// com.openai.models.chat/** 下，不受此排除影响。
	exclude 'com/openai/models/models/**'
	// 全部 async 服务树：LlmClient 用阻塞 API（.create() / .createStreaming()），
	// 不会触碰任何 services.async.* 类。
	exclude 'com/openai/services/async/**'
	// 阻塞服务只保留 chat 子树（ChatService + chat/**）；其余 19 个域全不用。
	exclude 'com/openai/services/blocking/assistants/**'
	exclude 'com/openai/services/blocking/audit_logs/**'
	exclude 'com/openai/services/blocking/batches/**'
	exclude 'com/openai/services/blocking/completions/**'
	exclude 'com/openai/services/blocking/containers/**'
	exclude 'com/openai/services/blocking/conversations/**'
	exclude 'com/openai/services/blocking/embeddings/**'
	exclude 'com/openai/services/blocking/evals/**'
	exclude 'com/openai/services/blocking/files/**'
	exclude 'com/openai/services/blocking/fine_tuning/**'
	exclude 'com/openai/services/blocking/images/**'
	exclude 'com/openai/services/blocking/models/**'
	exclude 'com/openai/services/blocking/moderations/**'
	exclude 'com/openai/services/blocking/realtime/**'
	exclude 'com/openai/services/blocking/responses/**'
	exclude 'com/openai/services/blocking/skills/**'
	exclude 'com/openai/services/blocking/uploads/**'
	exclude 'com/openai/services/blocking/vector_stores/**'
	exclude 'com/openai/services/blocking/videos/**'
	exclude 'com/openai/services/blocking/webhooks/**'
	// GraalVM 原生镜像反射配置（reflect-config.json 3.7 MB 等）：Fabric mod 跑在
	// JVM 上，原生镜像元数据完全无用。
	exclude 'META-INF/native-image/**'
	// Kotlin 模块信息 / ProGuard 规则：JVM 运行时不需要这两个元数据文件。
	exclude 'META-INF/openai-java-core.kotlin_module'
	exclude 'META-INF/proguard/openai-java-core.pro'

	// ---- 类路径冲突隔离 ----
	// 把所有 shaded 进 jar 的三方库 relocate 到 com.swaydy.opencraft.shadow.* 下，
	// 避免与 Mojang 自带类、其它 mod 共用 FQN 时的 NoSuchMethod / 重复类问题。
	// 当前实际已经在发生的冲突：org.slf4j（MC 1.17+ 自带）、kotlin.*（fabric-language-kotlin）。
	relocate 'org.slf4j',                 'com.swaydy.opencraft.shadow.slf4j'
	relocate 'org.jetbrains.kotlin',      'com.swaydy.opencraft.shadow.kotlin'
	relocate 'org.jetbrains.annotations', 'com.swaydy.opencraft.shadow.annotations'
	relocate 'kotlin',                    'com.swaydy.opencraft.shadow.kotlin'
	relocate 'kotlinx',                   'com.swaydy.opencraft.shadow.kotlinx'
	relocate 'okhttp3',                   'com.swaydy.opencraft.shadow.okhttp3'
	relocate 'okio',                      'com.swaydy.opencraft.shadow.okio'
	relocate 'com.fasterxml',             'com.swaydy.opencraft.shadow.fasterxml'
	relocate 'com.openai',                'com.swaydy.opencraft.shadow.openai'
}

// remapJar 改用 shadowJar 的输出作为输入，这样 Loom 在重新映射字节码的同时
// 也把 shade 进来的库一并打包进最终 mod jar。
remapJar {
	dependsOn shadowJar
	inputFile = shadowJar.archiveFile
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// ------------------------------------------------------------------
// 端到端测试便捷任务。
// 单任务：./gradlew runE2E -Pe2eTask=chop_tree（删 run/world → spawn-protection=0 → runE2eServer）
// 全部任务：./gradlew runE2E（每个任务都在自己的全新世界里跑，等价于 5 次单任务——
//   修"all 共享世界导致后续任务受前任务残留物/负载影响而失败"的问题）
// ------------------------------------------------------------------
tasks.register('cleanE2EWorld') {
	group = 'opencraft'
	description = 'Delete run/world for a fresh e2e save'
	doLast {
		delete file('run/world')
		logger.lifecycle('[E2E] 已删除 run/world（全新存档）')
	}
}

// 确保 spawn-protection=0（助手非 op，出生点保护圈内不能破坏方块）。
// 已有文件则替换该行，否则创建最小配置。
tasks.register('prepareE2EProps') {
	group = 'opencraft'
	description = 'Prepare a fresh natural e2e world with fixed seed and spawn access'
	doLast {
		def props = file('run/server.properties')
		def lines = []
		if (props.exists()) {
			lines = props.readLines('UTF-8')
		}
		def keys = ['level-seed', 'level-type', 'generate-structures',
		            'spawn-protection', 'online-mode']
		def filtered = lines.findAll { line -> keys.every { key -> !line.trim().startsWith(key + '=') } }
		def seed = project.findProperty('e2eSeed') ?: (project.findProperty('opencraft.e2e.seed') ?: 'opencraft-e2e-2026-09-02-04')
		filtered << "level-seed=${seed}"
		filtered << 'level-type=minecraft:normal'
		filtered << 'generate-structures=true'
		filtered << 'spawn-protection=0'
		filtered << 'online-mode=false'
		props.parentFile.mkdirs()
		props.text = filtered.join('\n') + '\n'
		logger.lifecycle("[E2E] 已准备自然世界: seed=${seed}, spawn-protection=0, online-mode=false")
	}
}

// 列出已注册 e2e 任务 id（供 bin/run_e2e_all.sh 自动发现新任务，无需手动维护列表）
tasks.register('e2eList') {
	group = 'opencraft'
	description = 'List registered e2e task ids (extracted from e2e/tasks/*.java id() methods)'
	doLast {
		def dir = file('src/main/java/com/swaydy/opencraft/e2e/tasks')
		dir.listFiles().findAll { it.name.endsWith('Task.java') }.sort { it.name }.each { f ->
			def text = f.getText('UTF-8')
			// 找 id() 方法体里的第一个 return "..."
			def matcher = (text =~ /id\(\)\s*\{\s*return "([a-z_0-9]+)";/)
			if (matcher.find()) {
				println matcher.group(1)
			} else {
				logger.warn('[E2E] 未能从 {} 解析任务 id', f.name)
			}
		}
	}
}

// 单任务：./gradlew runE2E -Pe2eTask=chop_tree（删世界 + 独立服务器 + 跑完退出）
// 全部任务每任务全新世界：bash bin/run_e2e_all.sh（GradleBuild 不支持嵌套同一项目）
tasks.register('runE2E') {
	group = 'opencraft'
	description = 'Natural-world e2e at the real spawn. Use -Pe2eTask=<id>; run bin/run_e2e_all.sh for all tasks'
	def e2eTask = project.findProperty('e2eTask')
	if (e2eTask == null || e2eTask.toString().isBlank()) {
		doLast {
			throw new GradleException('必须指定 -Pe2eTask=<id>；全量请运行 bash bin/run_e2e_all.sh')
		}
	} else if ('all'.equalsIgnoreCase(e2eTask.toString())) {
		doLast {
			throw new GradleException('all 会在同一世界连续执行，违反自然 e2e 语义；请运行 bash bin/run_e2e_all.sh')
		}
	} else {
		dependsOn 'cleanE2EWorld', 'prepareE2EProps', 'runE2eServer'
	}
}
